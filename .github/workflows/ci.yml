name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # прогоны в настоящем браузере; отдельной задачей, чтобы сбой сети до Steam не красил основную
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - run: npm run e2e:kit
      - run: npm run e2e:styles
      - run: npm run e2e:helper
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: e2e-out
